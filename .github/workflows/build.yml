name: Build Mobile Harness

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.4)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub release'
        type: boolean
        required: false
        default: false

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_MIN_SDK: '28'
  ANDROID_TARGET_SDK: '36'
  NDK_VERSION: '26.1.10909125'

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run lint (online)
        run: ./gradlew lintDebug

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/

  build-online:
    name: Build Online APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build online debug APK
        run: ./gradlew assembleOnlineDebug

      - name: Build online release APK (unsigned)
        run: ./gradlew assembleOnlineRelease

      - name: Upload online debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Upload online release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-release
          path: app/build/outputs/apk/online/release/*.apk

  build-offline:
    name: Build Offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build offline debug APK
        run: ./gradlew assembleOfflineDebug

      - name: Build offline release APK (unsigned)
        run: ./gradlew assembleOfflineRelease

      - name: Upload offline debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-offline-debug
          path: app/build/outputs/apk/offline/debug/*.apk

      - name: Upload offline release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-offline-release
          path: app/build/outputs/apk/offline/release/*.apk

  build-all:
    name: Build All Variants
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [build-online, build-offline]
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks/
          pattern: mobile-harness-*

      - name: List downloaded APKs
        run: find apks/ -name "*.apk" -exec ls -lh {} \;

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-online, build-offline, unit-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.4-$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Build release APKs
        run: |
          ./gradlew assembleOnlineRelease assembleOfflineRelease

      - name: Download online debug APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-online-release
          path: release/

      - name: Download offline debug APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-offline-release
          path: release/

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          find release/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Mobile Harness v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            release-apks/*.apk
          body: |
            ## Mobile Harness v${{ steps.version.outputs.VERSION }}

            ### Download
            - **Online APK** (44 MB) — Download runtime bundles on first launch
            - **Offline APK** (818 MB) — All runtime bundles included

            ### What's New
            - Added AgentRouter, Huancheng, 9router, and OpenCode Zen providers
            - Compatible with all Hermes providers

            ### Installation
            1. Download the APK
            2. Allow installation from unknown sources
            3. Launch and follow setup wizard

            ### System Requirements
            - Android 9+ (API 28)
            - ARM64 device
            - 2GB free storage (online) / 1.5GB (offline)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
