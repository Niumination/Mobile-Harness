name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_MIN_SDK: '28'
  ANDROID_TARGET_SDK: '36'
  NDK_VERSION: '26.1.10909125'

permissions:
  contents: write

jobs:
  build-signed:
    name: Build Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: ${{ env.ANDROID_COMPILE_SDK }}
          target-sdk: ${{ env.ANDROID_TARGET_SDK }}
          min-sdk: ${{ env.ANDROID_MIN_SDK }}
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile-harness-upload.jks

      - name: Build Signed Online Release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export MH_UPLOAD_STORE_FILE=mobile-harness-upload.jks
          export MH_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          export MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          export MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          ./gradlew assembleOnlineRelease

      - name: Build Signed Offline Release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export MH_UPLOAD_STORE_FILE=mobile-harness-upload.jks
          export MH_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          export MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          export MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          ./gradlew assembleOfflineRelease

      - name: Upload Signed APKs
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: |
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/apk/offline/release/*.apk

      - name: Create Release
        if: env.KEYSTORE_BASE64 != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile Harness ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/apk/offline/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
